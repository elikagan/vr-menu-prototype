<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Menu — 3D Environment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #000;
    color: rgba(255, 255, 255, 0.9);
  }

  canvas { display: block; }

  /* ── Laser pointer cursor ── */
  body {
    cursor: none;
  }

  #laser-dot {
    position: fixed;
    pointer-events: none;
    z-index: 10000;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(120,180,255,0.9) 40%, rgba(80,140,255,0.4) 70%, transparent 100%);
    box-shadow: 0 0 8px 2px rgba(100,160,255,0.6), 0 0 20px 4px rgba(80,140,255,0.3);
    transform: translate(-50%, -50%);
    transition: width 0.1s, height 0.1s;
  }

  #laser-dot.clicking {
    width: 18px;
    height: 18px;
    box-shadow: 0 0 12px 4px rgba(100,160,255,0.8), 0 0 30px 8px rgba(80,140,255,0.5);
  }

  /* ── HUD overlay ── */
  #hud {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* ── Controls hint ── */
  #controls-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.02em;
    display: flex;
    gap: 20px;
    transition: opacity 0.5s;
  }

  #controls-hint kbd {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin: 0 2px;
  }

  /* ── Sample HUD menu panel ── */
  .hud-panel {
    position: absolute;
    pointer-events: auto;
    background: rgba(20, 22, 28, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    cursor: grab;
    user-select: none;
  }

  .hud-panel:active { cursor: grabbing; }

  .hud-panel h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.45);
    margin-bottom: 12px;
  }

  .hud-panel .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.8);
    transition: background 0.15s;
    cursor: pointer;
  }

  .hud-panel .menu-item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }

  .hud-panel .menu-item .icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: rgba(100,160,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(120,180,255,0.9);
    flex-shrink: 0;
  }

  .hud-panel .status-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }

  .hud-panel .status-row .value {
    color: rgba(255,255,255,0.8);
    font-weight: 500;
  }

  .hud-panel .status-row .value.good { color: rgba(80,200,120,0.9); }
  .hud-panel .status-row .value.warn { color: rgba(255,180,60,0.9); }

  .hud-panel .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 8px 0;
  }

  /* ── Crosshair (center reticle) ── */
  #reticle {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 150;
    pointer-events: none;
    opacity: 0.2;
  }

  #reticle::before, #reticle::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.5);
  }
  #reticle::before { width: 1px; height: 16px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #reticle::after { width: 16px; height: 1px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>

<!-- Laser pointer dot -->
<div id="laser-dot"></div>

<!-- Center reticle -->
<div id="reticle"></div>

<!-- HUD overlay (menus live here) -->
<div id="hud">
  <!-- Procedure panel — top left -->
  <div class="hud-panel" id="panel-procedure" style="top: 60px; left: 40px;">
    <h3>Active Procedure</h3>
    <div class="menu-item" style="color: rgba(100,200,130,0.9); font-weight: 500;">
      <div class="icon" style="background: rgba(80,200,120,0.15); color: rgba(80,200,120,0.9);">✓</div>
      Pre-flight Check
    </div>
    <div class="menu-item" style="color: rgba(100,180,255,0.9); font-weight: 500;">
      <div class="icon">②</div>
      Engine Start Sequence
    </div>
    <div class="menu-item">
      <div class="icon" style="background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3);">③</div>
      Taxi & Takeoff
    </div>
    <div class="menu-item">
      <div class="icon" style="background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3);">④</div>
      Climb & Cruise
    </div>
  </div>

  <!-- Status panel — top right -->
  <div class="hud-panel" id="panel-status" style="top: 60px; right: 40px; min-width: 200px;">
    <h3>System Status</h3>
    <div class="status-row">
      <span>Engines</span>
      <span class="value good">Online</span>
    </div>
    <div class="status-row">
      <span>Hydraulics</span>
      <span class="value good">Normal</span>
    </div>
    <div class="status-row">
      <span>Fuel</span>
      <span class="value warn">68%</span>
    </div>
    <div class="divider"></div>
    <div class="status-row">
      <span>Altitude</span>
      <span class="value">FL350</span>
    </div>
    <div class="status-row">
      <span>Speed</span>
      <span class="value">M 0.82</span>
    </div>
  </div>
</div>

<!-- Controls hint -->
<div id="controls-hint">
  <span><kbd>←</kbd> <kbd>→</kbd> Look around</span>
  <span><kbd>↑</kbd> <kbd>↓</kbd> Look up/down</span>
  <span>Drag panels to reposition</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════════════
// Scene setup
// ══════════════════════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

// ══════════════════════════════════════════
// 360 panorama sphere
// ══════════════════════════════════════════
const textureLoader = new THREE.TextureLoader();
const panoramaTexture = textureLoader.load('cockpit-360/panorama.jpg', () => {
  renderer.render(scene, camera); // render once loaded
});
panoramaTexture.colorSpace = THREE.SRGBColorSpace;

const sphereGeometry = new THREE.SphereGeometry(100, 64, 32);
sphereGeometry.scale(-1, 1, 1); // flip faces inward

const sphereMaterial = new THREE.MeshBasicMaterial({
  map: panoramaTexture
});

const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
scene.add(sphere);

// ══════════════════════════════════════════
// Camera rotation (arrow keys)
// ══════════════════════════════════════════
const rotationState = {
  yaw: 0,    // horizontal rotation (radians)
  pitch: 0,  // vertical rotation (radians)
  speed: 0.025,
  pitchLimit: Math.PI / 3, // 60 degrees up/down
  keys: {}
};

document.addEventListener('keydown', (e) => {
  rotationState.keys[e.code] = true;
  // Fade out hint after first key press
  const hint = document.getElementById('controls-hint');
  if (hint) hint.style.opacity = '0';
});

document.addEventListener('keyup', (e) => {
  rotationState.keys[e.code] = false;
});

function updateCamera() {
  const k = rotationState.keys;
  const s = rotationState.speed;

  if (k['ArrowLeft'])  rotationState.yaw += s;
  if (k['ArrowRight']) rotationState.yaw -= s;
  if (k['ArrowUp'])    rotationState.pitch = Math.min(rotationState.pitch + s, rotationState.pitchLimit);
  if (k['ArrowDown'])  rotationState.pitch = Math.max(rotationState.pitch - s, -rotationState.pitchLimit);

  // Apply rotation using Euler (yaw then pitch)
  const euler = new THREE.Euler(rotationState.pitch, rotationState.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

// ══════════════════════════════════════════
// Laser pointer cursor
// ══════════════════════════════════════════
const laserDot = document.getElementById('laser-dot');

document.addEventListener('mousemove', (e) => {
  laserDot.style.left = e.clientX + 'px';
  laserDot.style.top = e.clientY + 'px';
});

document.addEventListener('mousedown', () => laserDot.classList.add('clicking'));
document.addEventListener('mouseup', () => laserDot.classList.remove('clicking'));

// Hide laser when mouse leaves window
document.addEventListener('mouseleave', () => laserDot.style.display = 'none');
document.addEventListener('mouseenter', () => laserDot.style.display = 'block');

// ══════════════════════════════════════════
// Draggable HUD panels
// ══════════════════════════════════════════
function makeDraggable(panel) {
  let isDragging = false;
  let startX, startY, origLeft, origTop;

  panel.addEventListener('mousedown', (e) => {
    // Don't drag if clicking a menu item
    if (e.target.closest('.menu-item')) return;

    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const rect = panel.getBoundingClientRect();
    origLeft = rect.left;
    origTop = rect.top;

    // Reset any right/bottom positioning to use left/top
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.left = origLeft + 'px';
    panel.style.top = origTop + 'px';

    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    panel.style.left = (origLeft + dx) + 'px';
    panel.style.top = (origTop + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
}

document.querySelectorAll('.hud-panel').forEach(makeDraggable);

// ══════════════════════════════════════════
// Render loop
// ══════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  updateCamera();
  renderer.render(scene, camera);
}
animate();

// ══════════════════════════════════════════
// Resize handler
// ══════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
